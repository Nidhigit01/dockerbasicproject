# The URL for your MySQL database
spring.datasource.url=jdbc:mysql://localhost:3306/userdb?useSSL=false

# The username for the database user
spring.datasource.username=root

# The password for the database user
spring.datasource.password=root

# The driver class name (for recent MySQL Connector versions)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Optional: Hibernate DDL mode for schema management (update, create, create-drop, none)
spring.jpa.hibernate.ddl-auto=update

# Optional: To show the executed SQL in the console
spring.jpa.show-sql=true
